services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spendless
      POSTGRES_PASSWORD: spendless
      POSTGRES_DB: spendless
    ports:
      - "5432:5432"
    volumes:
      - spendless_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendless -d spendless"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://spendless:spendless@db:5432/spendless
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_change_me_use_openssl_rand_hex_32_minimum_chars}
      JWT_ACCESS_EXPIRES: "15m"
      JWT_REFRESH_DAYS: 14
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(\"http://127.0.0.1:4000/api/v1/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/main.js"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: 3000

volumes:
  spendless_pg:
